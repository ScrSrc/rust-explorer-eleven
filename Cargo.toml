[package]
name = "win11_explorer"
version = "1.0.0"
edition = "2021"
description = "A Windows 11 File Explorer clone written in Rust"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard", "links", "system_fonts", "accesskit"] }
egui = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico", "tiff"] }
sysinfo = "0.40.0"
trash = "5.2.9"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Com_StructuredStorage", "Win32_Storage_FileSystem", "Win32_System_Registry"] }

[build-dependencies]
winresource = "0.1.30"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
